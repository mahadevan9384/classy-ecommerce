<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Trendy</title>
    <meta name="description" content="Log in to your Trendy account to access your cart and exclusive products.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-logo">Trendy</a>
        <button class="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="nav-icons">
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count">0</span>
            </a>
        </div>
    </nav>

    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5%;">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="identifier">Email Address or Mobile Number</label>
                    <input type="text" id="identifier" class="form-control" required placeholder="yourname@gmail.com or 9876543210">
                    <small style="color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px; display: block;">Only @gmail.com addresses or 10-digit Indian numbers</small>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-block" id="login-btn">Log In</button>
                <div class="form-text">
                    Don't have an account? <a href="signup.html">Create one here</a>
                </div>
            </form>
            <div style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.78rem;">
                <i class="fas fa-shield-halved" style="color: var(--success-color);"></i> Protected by end-to-end encryption
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="main.js"></script>
    <script>
        const API_BASE = window.location.origin;

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            // Basic Client Validation
            const isEmail = identifier.includes('@');
            if (isEmail) {
                const gmailRegex = /^[a-zA-Z0-9._%+\-]+@gmail\.com$/i;
                if (!gmailRegex.test(identifier)) {
                    showToast('Only Gmail addresses (@gmail.com) are accepted', 'error');
                    return;
                }
            } else {
                const mobileRegex = /^[6-9]\d{9}$/;
                if (!mobileRegex.test(identifier)) {
                    showToast('Please enter a valid 10-digit Indian mobile number', 'error');
                    return;
                }
            }

            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Store user info and token
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('authToken', data.token);
                    currentUser = data.user;
                    showToast('Logged in successfully!');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    showToast(data.error, 'error');
                    btn.innerHTML = 'Log In';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('Login error:', err);
                showToast('Server error. Make sure the backend is running.', 'error');
                btn.innerHTML = 'Log In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
